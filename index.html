<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>Song Shaker</title>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
    <header>
        <img class="title" src="songshakertitle.png" width="500">
        <h1 class="tagline">Shake me up to get a random song reccomendation!</h1>
    </header>
    <main>
        <section class="globe-card">
            <div class="globe" id="globe">
               <img class="" src="snowglobe.png">
            </div>
            <button id="shake">Shake the globe!</button>
            <p class="musicrec" id="musicrec">press the button and find your next tune</p>
        </section>
    </main>
    <footer>
        <p>Made by Vedanshi Das</p>
    </footer>
    </body>
</html>
